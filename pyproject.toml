[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "midi2audio"
version = "0.1.0"
description = "Reference-track-anchored multitrack MIDI expressivization, rendering, and generative restyling pipeline"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Autonomous DSP Agent", email = "agent@dsp-pipeline.internal" }]
license = "MIT"
dependencies = [
    "pretty_midi>=0.2.10",
    "miditoolkit>=0.1.16",
    "music21>=9.1.0",
    "mido>=1.3.2",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "librosa>=0.10.1",
    "soundfile>=0.12.1",
    "pyfluidsynth>=1.3.3",
    "pydantic>=2.5.0",
    "pyyaml>=6.0.1",
    "httpx>=0.25.0",
    "tenacity>=8.2.3",
]

[project.optional-dependencies]
advanced_dsp = [
    "madmom>=0.16.1",
    "demucs>=4.0.1",
    "basic-pitch>=0.3.0",
    "matchering>=2.0.6",
]
dev = [
    "pytest>=7.4.0",
    "hypothesis>=6.92.0",
    "vcrpy>=5.0.0",
    "pytest-mock>=3.12.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["m2a*"]
exclude = ["config*", "tests*", "scripts*"]

[project.scripts]
midi2audio = "scripts.run_pipeline:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"